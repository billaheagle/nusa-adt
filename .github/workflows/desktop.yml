# Builds the Nusa Studio installers for Windows, macOS and Linux and attaches them to a
# draft GitHub release. Run it from the Actions tab ("Run workflow") or push a tag v*.
name: Build desktop app

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npx tsc -p .
      - run: npm test

  # Compiles and unit-tests the Rust core on one platform in a few minutes, so a compile
  # error shows up before the three long installer builds start.
  rust:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Compile and test
        working-directory: src-tauri
        run: |
          mkdir -p ../dist-app && touch ../dist-app/index.html
          cargo test
      # Commit this file to src-tauri/ so every build uses the same crate versions.
      - uses: actions/upload-artifact@v4
        with:
          name: Cargo.lock
          path: src-tauri/Cargo.lock

  build:
    needs: [test, rust]
    permissions:
      contents: write
    env:
      # In-app updates: set the secrets TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD
      # and TAURI_UPDATER_PUBKEY (see README, "In-app updates"). Without them the build works the
      # same and the app only points to new releases.
      UPDATER_READY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && secrets.TAURI_UPDATER_PUBKEY != '' }}
      NUSA_REPO: ${{ github.repository }}
      # Code signing (see README, "Code signing"). Each platform is signed only when its secrets exist;
      # without them the build is the same as before, unsigned.
      WIN_SIGN: ${{ secrets.WINDOWS_CERTIFICATE != '' && secrets.WINDOWS_CERTIFICATE_PASSWORD != '' }}
      MAC_SIGN: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_SIGNING_IDENTITY != '' }}
      MAC_NOTARIZE: ${{ secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev

      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm install

      - name: Enable in-app updates
        if: env.UPDATER_READY == 'true'
        shell: bash
        env:
          PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        run: |
          node -e '
            const fs = require("fs"), f = "src-tauri/tauri.conf.json";
            const c = JSON.parse(fs.readFileSync(f, "utf8"));
            c.bundle.createUpdaterArtifacts = true;
            c.plugins = { ...(c.plugins || {}), updater: { pubkey: process.env.PUBKEY.trim(),
              endpoints: [`https://github.com/${process.env.NUSA_REPO}/releases/latest/download/latest.json`] } };
            fs.writeFileSync(f, JSON.stringify(c, null, 2));
            console.log("updater on for", process.env.NUSA_REPO);
          '

      # Windows: the PFX goes into the user certificate store; Tauri signs with its thumbprint.
      - name: Windows code signing certificate
        if: matrix.platform == 'windows-latest' && env.WIN_SIGN == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'nusa-sign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String(($env:WINDOWS_CERTIFICATE -replace '\s', '')))
          $pw = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw |
            Where-Object { $_.HasPrivateKey } | Select-Object -First 1
          if (-not $cert) { throw 'The PFX in WINDOWS_CERTIFICATE has no certificate with a private key' }
          Remove-Item $pfx
          $env:SIGN_THUMBPRINT = $cert.Thumbprint
          $js = Join-Path $env:RUNNER_TEMP 'sign-config.cjs'
          @'
          const fs = require("fs"), f = "src-tauri/tauri.conf.json";
          const c = JSON.parse(fs.readFileSync(f, "utf8"));
          c.bundle.windows = { ...(c.bundle.windows || {}), certificateThumbprint: process.env.SIGN_THUMBPRINT,
            digestAlgorithm: "sha256", timestampUrl: "http://timestamp.digicert.com" };
          fs.writeFileSync(f, JSON.stringify(c, null, 2));
          '@ | Set-Content $js
          node $js
          "SIGN_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV
          Write-Host "Windows signing with certificate $($cert.Subject)"

      # macOS: Tauri imports the certificate, signs, and notarizes when the Apple ID secrets exist too.
      # The variables are only set when the secrets exist, an empty value would make the build try to sign.
      - name: macOS signing and notarization settings
        if: matrix.platform == 'macos-latest' && env.MAC_SIGN == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          put() { { echo "$1<<NUSA_EOF"; printf '%s\n' "$2"; echo "NUSA_EOF"; } >> "$GITHUB_ENV"; }
          put APPLE_CERTIFICATE "$(printf '%s' "$APPLE_CERTIFICATE" | tr -d '\n\r ')"
          put APPLE_CERTIFICATE_PASSWORD "$APPLE_CERTIFICATE_PASSWORD"
          put APPLE_SIGNING_IDENTITY "$APPLE_SIGNING_IDENTITY"
          if [ "$MAC_NOTARIZE" = "true" ]; then
            put APPLE_ID "$APPLE_ID"; put APPLE_PASSWORD "$APPLE_PASSWORD"; put APPLE_TEAM_ID "$APPLE_TEAM_ID"
            echo "macOS: signing and notarization on"
          else
            echo "macOS: signing on, notarization off (APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID not set)"
          fi

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Nusa Studio v__VERSION__
          releaseBody: |
            Installers for Windows (.msi / -setup.exe), macOS (.dmg) and Linux (.deb).
            Portable, no install needed: Windows *-portable-x64.exe, macOS *-portable-macos.zip, Linux *-portable-x86_64.AppImage.
            Builds made without code-signing certificates show a warning the first time: Windows SmartScreen
            ("More info" → "Run anyway"), macOS right-click → Open.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: ${{ env.UPDATER_READY == 'true' }}
          args: ${{ matrix.args }}

      - name: Package portable build
        shell: bash
        env:
          VERSION: ${{ steps.tauri.outputs.appVersion }}
        run: |
          mkdir -p portable
          case "${{ runner.os }}" in
            Windows)
              cp src-tauri/target/release/nusa-adt.exe "portable/Nusa-Studio-${VERSION}-portable-x64.exe"
              if [ -n "$SIGN_THUMBPRINT" ]; then
                # the portable exe is signed with the same certificate as the installers
                signtool=$(ls -d "/c/Program Files (x86)/Windows Kits/10/bin/"*/x64/signtool.exe | sort -V | tail -1)
                "$signtool" sign //sha1 "$SIGN_THUMBPRINT" //fd sha256 //tr http://timestamp.digicert.com //td sha256 "portable/Nusa-Studio-${VERSION}-portable-x64.exe"
              fi ;;
            macOS)
              ditto -c -k --keepParent "src-tauri/target/universal-apple-darwin/release/bundle/macos/Nusa Studio.app" \
                "portable/Nusa-Studio-${VERSION}-portable-macos.zip" ;;
            Linux)
              cp src-tauri/target/release/bundle/appimage/*.AppImage "portable/Nusa-Studio-${VERSION}-portable-x86_64.AppImage"
              chmod +x portable/*.AppImage ;;
          esac
          ls -la portable

      - name: Attach portable build to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.tauri.outputs.releaseId }}
          REPO: ${{ github.repository }}
        run: |
          for f in portable/*; do
            name=$(basename "$f")
            # replace an asset left by an earlier run of the same version
            old=$(gh api "repos/$REPO/releases/$RELEASE_ID/assets" --jq ".[] | select(.name==\"$name\") | .id")
            if [ -n "$old" ]; then gh api -X DELETE "repos/$REPO/releases/assets/$old"; fi
            curl -sSf -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$f" \
              "https://uploads.github.com/repos/$REPO/releases/$RELEASE_ID/assets?name=$name" > /dev/null
            echo "uploaded $name"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: nusa-adt-portable-${{ runner.os }}
          path: portable/*
